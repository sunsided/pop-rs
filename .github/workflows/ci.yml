name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lifter:
    name: pop-lifter tests (incl. rustc compile-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The lifter tests read the vendored POP source; without the
          # submodule the `source_dir` fixture skips most of the suite.
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `tests/test_rust_compile.py` compiles the generated `ir/raw-rs`
      # tree under `rustc -D warnings`; it skips when rustc is absent, so
      # CI installs a toolchain to make the compile-check actually run.
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install pop-lifter + test deps
        working-directory: tooling/pop_lifter
        run: pip install -e . pytest

      - name: Run test suite
        working-directory: tooling/pop_lifter
        run: pytest -q

  dependencies:
    name: Dependency Submission
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-sbom
        uses: psastras/sbom-rs/actions/install-cargo-sbom@cargo-sbom-v0.10.0

      - name: Generate SBOM
        run: cargo-sbom --output-format=spdx_json_2_3 > sbom.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Submit dependencies to GitHub
        uses: advanced-security/spdx-dependency-submission-action@v0.2.0
        with:
          filePath: sbom.json
